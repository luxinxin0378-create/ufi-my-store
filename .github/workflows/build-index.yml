name: Auto-generate UFI-TOOLS plugin index

on:
  push:
    branches:
      - main
    paths:
      - "plugins/*.js"
      - ".github/workflows/build-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate index.json
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          plugins_dir = Path("plugins")
          items = []

          for path in sorted(plugins_dir.iterdir(), key=lambda p: p.name):
              if not path.is_file() or path.suffix.lower() != ".js":
                  continue

              last_commit = subprocess.run(
                  ["git", "log", "-1", "--format=%cI", "--", path.as_posix()],
                  check=True, capture_output=True, text=True
              ).stdout.strip()

              if last_commit:
                  modified = datetime.fromisoformat(
                      last_commit.replace("Z", "+00:00")
                  ).astimezone(ZoneInfo("Asia/Shanghai")).isoformat(timespec="seconds")
              else:
                  modified = datetime.now(ZoneInfo("Asia/Shanghai")).isoformat(timespec="seconds")

              items.append({
                  "name": path.name,
                  "modified": modified,
                  "hash_info": {},
                  "size": path.stat().st_size,
                  "is_dir": False
              })

          payload = {
              "download_url": "https://raw.githubusercontent.com/luxinxin0378-create/ufi-my-store/main/plugins",
              "res": {
                  "code": 200,
                  "message": "success",
                  "data": {"content": items}
              }
          }

          Path("index.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(f"Generated index.json with {len(items)} JavaScript plugins.")

          PY

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json is already up to date."
          else
            git commit -m "chore: auto-update plugin index"
            git push
          fi
